<style>

  html,body{margin:0;padding:0;}

    opacity:.16;
    background-image:

      linear-gradient(90deg, rgba(53,245,207,.035) 1px, transparent 1px);

    mask-image:linear-gradient(to bottom, black, transparent 85%);

  body::after{
    content:"";
    position:fixed;
    width:420px;height:420px;
    right:-180px;top:-180px;
    border-radius:50%;
    border:1px solid rgba(53,245,207,.16);
    box-shadow:0 0 90px rgba(53,245,207,.08), inset 0 0 90px rgba(53,245,207,.05);
    pointer-events:none;
  }

  .brand .mark{
    width:52px;height:52px;border-radius:14px;
    background:rgba(3,7,12,.8);

    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    box-shadow:0 0 16px rgba(53,245,207,.20), inset 0 0 18px rgba(53,245,207,.08);
    position:relative;
  }
  .brand .mark::after{
    content:"";
    position:absolute;inset:-1px;
    border-radius:14px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
    pointer-events:none;
  }
  .brand .mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .brand .name{font-size:12px;color:#8ea2aa;line-height:1.35;letter-spacing:.02em;}
  .brand .name b{color:#edfaff;display:block;font-size:14px;letter-spacing:.01em;}

  .steps{display:flex;gap:6px;align-items:center;}
  .steps .seg{
    width:34px;height:5px;border-radius:10px;
    background:rgba(255,255,255,.12);
    transition:all .3s ease;
    box-shadow:inset 0 0 4px rgba(0,0,0,.4);

  .steps .seg.active{

  }

    border:1px solid rgba(129,190,196,.18);
    border-radius:22px;
    padding:34px 32px;
    box-shadow:

  .card::before{
    content:"";
    position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg, transparent, var(--glow), var(--violet), transparent);
    opacity:.8;
    box-shadow:0 0 18px rgba(53,245,207,.55);

  .card::after{
    content:"";
    position:absolute;width:180px;height:180px;right:-95px;top:-95px;
    border-radius:50%;

  .score-card .who{font-size:11px;font-weight:800;color:#81979f;letter-spacing:.05em;}
  .score-card .val{font-family:'Public Sans';font-weight:900;font-size:30px;color:#effbfc;margin-top:3px;}
  .score-card.win .val{color:var(--glow);text-shadow:0 0 16px rgba(53,245,207,.25);}

  .cr-box{

  }
  .cr-ok{background:rgba(53,245,207,.055);border:1px solid rgba(53,245,207,.22);color:#9fe9db;}
  .cr-bad{background:rgba(244,114,94,.07);border:1px solid rgba(244,114,94,.25);color:#ffb1a1;}

  .thanks-hero{text-align:center;padding:10px 0 6px;}
  .thanks-hero .big{font-family:'Public Sans';font-weight:900;font-size:23px;color:#effbfc;text-shadow:0 0 18px rgba(53,245,207,.08);}

  @keyframes cardIn{
    from{opacity:0;transform:translateY(12px) scale(.99);}

    from{opacity:0;transform:translateY(-8px);}
    to{opacity:1;transform:none;}

  @media (max-width:480px){
    body{padding:20px 12px 40px;}
    .card{padding:25px 18px;border-radius:18px;}
    .topbar{align-items:flex-start;}
    .brand .mark{width:44px;height:44px;border-radius:12px;}

<script>
/* ---------------------------------------------------------
   DATA
--------------------------------------------------------- */
// =========================================================
   // GOOGLE SHEETS SUBMISSION
   // Paste your deployed Google Apps Script Web App URL here.
   // Leave blank until you finish the Apps Script setup.
   const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_Un0VdJasUmFkauhAya2nPda099E5pn3L6wKj6OAzpvec8VVwGWSaht6BnJbMIuQ8/exec";
   // =========================================================

const CRITERIA = [
  { id:1, name:"Kualitas Pengalaman Berlatih",
    desc:"Kenyamanan termal ruangan, kualitas sirkulasi udara, tingkat kebisingan alat, serta tata letak dan kepadatan peralatan." },
  { id:2, name:"Keandalan Peralatan & Kontinuitas Layanan",
    desc:"Frekuensi kerusakan mendadak (corrective maintenance) dan potensi downtime yang mengganggu jadwal latihan pengguna." },
  { id:4, name:"Efisiensi Energi & Jejak Lingkungan",
    desc:"Intensitas konsumsi energi (IKE), potensi emisi karbon dari listrik, dan pengelolaan limbah elektronik peralatan pada akhir siklus pakai." },
  { id:5, name:"Pemerataan Akses & Manfaat bagi Sivitas",
    desc:"Sejauh mana opsi mendukung akses yang inklusif dan merata bagi seluruh kelompok pengguna internal, termasuk potensi realokasi dana hasil efisiensi ke layanan publik lain." },
  { id:6, name:"Dampak Sosial-Ekonomi bagi Masyarakat Sekitar",
    desc:"Peluang keterlibatan warga sekitar sebagai tenaga kerja operasional, kemitraan dengan UMKM/vendor lokal, keterbukaan akses bagi non-sivitas, serta dampak terhadap lingkungan sekitar (kebisingan, parkir, jam operasional)." },
  { id:7, name:"Fleksibilitas & Adaptabilitas Ruang",
    desc:"Kemudahan mengubah tata letak, menambah/mengganti peralatan, mengonversi ruang untuk fungsi lain, serta mengakomodasi teknologi baru tanpa renovasi besar." },
  { id:8, name:"Akuntabilitas Pengelolaan Aset (Governance)",
    desc:"Kemudahan pemantauan kondisi aset, transparansi jadwal pemeliharaan, dan kompleksitas kontrak/SLA yang harus diaudit institusi." },
];

const OPTION_A = {
  key:"A", label:"Opsi A — Gym Ekonomis",
  short:"Low-capex, peralatan kelas menengah",
  points:[
    "Investasi awal ±Rp109,73 miliar",
    "Peralatan commercial-grade kelas menengah",
    "Intensitas energi 220 kWh/m²/tahun (AC standar, tanpa BMS)",
    "Preventive maintenance 8%/tahun, corrective maintenance 7%/tahun",
    "Penggantian besar peralatan tiap 7 tahun (2× dalam 20 tahun)",
    "Nilai sisa akhir horizon ≈15% dari investasi awal",
  ]
};
const OPTION_B = {
  key:"B", label:"Opsi B — Gym Premium",
  short:"High-capex, peralatan full commercial-grade",
  points:[
    "Investasi awal ±Rp184,80 miliar",
    "Peralatan full commercial-grade/brand internasional, HVAC hemat energi + BMS",
    "Intensitas energi 140 kWh/m²/tahun (±36% lebih hemat)",
    "Preventive maintenance 5%/tahun (SLA vendor), corrective maintenance ±60% lebih jarang",
    "Penggantian besar peralatan tiap 14 tahun (1× dalam 20 tahun)",
    "Nilai sisa akhir horizon ≈25% dari investasi awal",
  ]
};

const SCALE = [9,7,5,3,1,3,5,7,9];
function scaleMeaning(v){
  if(v===1) return "Sama penting";
  if(v===3) return "Sedikit lebih penting";
  if(v===5) return "Lebih penting";
  if(v===7) return "Sangat lebih penting";
  return "Mutlak lebih penting";
}

function combinations(arr){
  const res=[];
  for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++) res.push([i,j]);
  return res;
}
const CRIT_PAIRS = combinations(CRITERIA); // 21 pairs, indices into CRITERIA

/* ---------------------------------------------------------
   STATE
--------------------------------------------------------- */
const state = {
  step: "intro", // intro -> criteria -> options -> done
  profile: { name:"", role:"" },
  critAnswers: new Array(CRIT_PAIRS.length).fill(null), // index 0-8 into SCALE
  critIdx: 0,
  optAnswers: new Array(CRITERIA.length).fill(null),
  optIdx: 0,
};

/* ---------------------------------------------------------
   AHP MATH
--------------------------------------------------------- */
const RI_TABLE = {1:0,2:0,3:0.58,4:0.90,5:1.12,6:1.24,7:1.32,8:1.41,9:1.45,10:1.49};

function buildCriteriaMatrix(){
  const n = CRITERIA.length;
  const m = Array.from({length:n}, ()=> new Array(n).fill(1));
  CRIT_PAIRS.forEach(([a,b], idx)=>{
    const si = state.critAnswers[idx];
    const val = SCALE[si];
    if(si < 4){ m[a][b] = val; m[b][a] = 1/val; }
    else if(si > 4){ m[b][a] = val; m[a][b] = 1/val; }
    else { m[a][b] = 1; m[b][a] = 1; }
  });
  return m;
}

function computeWeights(m){
  const n = m.length;
  const colSums = new Array(n).fill(0);
  for(let j=0;j<n;j++) for(let i=0;i<n;i++) colSums[j]+=m[i][j];
  const norm = m.map(row=>row.map((v,j)=>v/colSums[j]));
  const weights = norm.map(row=> row.reduce((a,b)=>a+b,0)/n);
  return weights;
}

function computeConsistency(m, weights){
  const n = m.length;
  const Aw = m.map(row=> row.reduce((sum,v,j)=> sum + v*weights[j], 0));
  const ratios = Aw.map((v,i)=> v/weights[i]);
  const lambdaMax = ratios.reduce((a,b)=>a+b,0)/n;
  const CI = (lambdaMax - n)/(n-1);
  const RI = RI_TABLE[n] || 1.49;
  const CR = RI===0 ? 0 : CI/RI;
  return { lambdaMax, CI, CR };
}

function optionLocalWeights(si){
  const val = SCALE[si];
  let wA, wB;
  if(si < 4){ wA = val/(val+1); wB = 1/(val+1); }
  else if(si > 4){ wB = val/(val+1); wA = 1/(val+1); }
  else { wA = 0.5; wB = 0.5; }
  return { wA, wB };
}

function computeResults(){
  const m = buildCriteriaMatrix();
  const weights = computeWeights(m);
  const { CR } = computeConsistency(m, weights);
  const rows = CRITERIA.map((c, i)=>{
    const { wA, wB } = optionLocalWeights(state.optAnswers[i]);
    return { criteria:c, weight:weights[i], wA, wB };
  });
  const scoreA = rows.reduce((s,r)=> s + r.weight*r.wA, 0);
  const scoreB = rows.reduce((s,r)=> s + r.weight*r.wB, 0);
  return { rows, scoreA, scoreB, CR };
}

/* ---------------------------------------------------------
   RENDER HELPERS
--------------------------------------------------------- */
const app = document.getElementById("app");

function topbar(activeStepIndex){
  const labels = ["Profil","Kriteria","Opsi","Selesai"];
  return `

function render(){
  if(state.step==="intro") return renderIntro();
  if(state.step==="criteria") return renderCriteria();
  if(state.step==="options") return renderOptions();
  if(state.step==="done") return renderDone();
}

/* ---- STEP 0: INTRO / PROFIL ---- */
function renderIntro(){
  app.innerHTML = `
    ${topbar(0)}
    <div class="card">
      <div class="eyebrow">LANGKAH 1 DARI 4</div>
      <h1 class="title">Sebelum mulai, kenalan dulu</h1>
      <p class="lede">Kuisioner ini mengumpulkan penilaian Anda atas kriteria non-finansial (AHP) untuk memutuskan opsi investasi Gym Publik ISHAP — sebuah fasilitas kebugaran publik non-revenue seluas ±800 m². Jawaban Anda akan diproses menjadi bobot kriteria dan skor akhir tiap opsi.</p>

      <label class="field-label">Nama Anda</label>
      <input id="inpName" type="text" placeholder="Tulis nama lengkap" value="${state.profile.name}">

      <label class="field-label">Peran Anda</label>
      <select id="inpRole">
        <option value="" ${state.profile.role===""?"selected":""}>Pilih peran</option>
        <option value="Mahasiswa/Sivitas" ${state.profile.role==="Mahasiswa/Sivitas"?"selected":""}>Mahasiswa / Sivitas Kampus</option>
        <option value="Dosen/Staf" ${state.profile.role==="Dosen/Staf"?"selected":""}>Dosen / Staf</option>
        <option value="Pengelola Aset" ${state.profile.role==="Pengelola Aset"?"selected":""}>Pengelola Aset / Manajemen</option>
        <option value="Warga Sekitar" ${state.profile.role==="Warga Sekitar"?"selected":""}>Warga Sekitar Kampus</option>
        <option value="Lainnya" ${state.profile.role==="Lainnya"?"selected":""}>Lainnya</option>
      </select>

      <div class="option-block">
        <span class="tag a">OPSI A</span>
        <h3>${OPTION_A.label}</h3>
        <p>${OPTION_A.short}</p>
        <ul>${OPTION_A.points.map(p=>`<li>${p}</li>`).join("")}</ul>
      </div>
      <div class="option-block">
        <span class="tag b">OPSI B</span>
        <h3>${OPTION_B.label}</h3>
        <p>${OPTION_B.short}</p>
        <ul>${OPTION_B.points.map(p=>`<li>${p}</li>`).join("")}</ul>
      </div>

      <p class="footnote">Selanjutnya Anda akan diminta membandingkan 7 kriteria non-finansial satu-per-satu (21 perbandingan), lalu membandingkan Opsi A dengan Opsi B pada tiap kriteria (7 perbandingan). Tidak ada jawaban benar atau salah — jawab berdasarkan penilaian dan pemahaman Anda atas kedua opsi.</p>

      <div class="btn-row">
        <button class="primary" id="btnStart">Mulai Penilaian Kriteria</button>
      </div>
    </div>
  `;
  document.getElementById("btnStart").onclick = ()=>{
    state.profile.name = document.getElementById("inpName").value.trim();
    state.profile.role = document.getElementById("inpRole").value;
    if(!state.profile.name){
      alert("Mohon isi nama Anda terlebih dahulu.");
      return;
    }
    state.step = "criteria";
    render();
  };
}

/* ---- STEP 1: CRITERIA PAIRWISE ---- */
function renderCriteria(){
  const idx = state.critIdx;
  const [a,b] = CRIT_PAIRS[idx];
  const left = CRITERIA[a], right = CRITERIA[b];
  const selected = state.critAnswers[idx];

  app.innerHTML = `
    ${topbar(1)}
    <div class="card">
      <div class="qmeta">Perbandingan Kriteria ${idx+1} dari ${CRIT_PAIRS.length}</div>
      <div class="qtitle">Menurut Anda, mana yang lebih penting dalam memilih opsi Gym Publik ISHAP?</div>

      <div class="versus">
        <div class="side left">
          <div class="num">Kriteria #${left.id}</div>
          <div class="label">${left.name}</div>
          <div class="desc">${left.desc}</div>
        </div>
        <div class="vs">VS</div>
        <div class="side right">
          <div class="num">Kriteria #${right.id}</div>
          <div class="label">${right.name}</div>
          <div class="desc">${right.desc}</div>
        </div>
      </div>

      <div class="scale">
        <div class="scale-track" id="scaleTrack">
          ${SCALE.map((v,i)=>`<button type="button" class="scale-btn ${i===4?'center':''} ${selected===i?'selected':''}" data-i="${i}">${v}</button>`).join("")}
        </div>
        <div class="scale-hints"><span>&larr; ${left.name.split(" ").slice(0,3).join(" ")}…</span><span>…${right.name.split(" ").slice(0,3).join(" ")} &rarr;</span></div>
        <div class="scale-caption" id="scaleCaption">${selected!==null ? captionFor(selected,left,right) : "Pilih salah satu angka di atas"}</div>
      </div>

      <div class="btn-row">
        <button class="ghost" id="btnBack">Kembali</button>
        <button class="primary" id="btnNext" ${selected===null?"disabled":""}>Lanjut</button>
      </div>
    </div>
  `;

  function captionFor(si,left,right){
    const val = SCALE[si];
    const meaning = scaleMeaning(val);
    if(si===4) return "Sama penting";
    const winner = si<4 ? left.name : right.name;
    return `${meaning} — condong ke "${winner}"`;
  }

  document.querySelectorAll(".scale-btn").forEach(btn=>{
    btn.onclick = ()=>{
      const i = parseInt(btn.dataset.i,10);
      state.critAnswers[idx] = i;
      renderCriteria();
    };
  });

  document.getElementById("btnNext").onclick = ()=>{
    if(idx < CRIT_PAIRS.length-1){
      state.critIdx++;
      renderCriteria();
    }else{
      state.step = "options";
      render();
    }
  };
  document.getElementById("btnBack").onclick = ()=>{
    if(idx>0){ state.critIdx--; renderCriteria(); }
    else{ state.step="intro"; render(); }
  };
}

/* ---- STEP 2: OPTIONS PAIRWISE (per criterion) ---- */
function renderOptions(){
  const idx = state.optIdx;
  const crit = CRITERIA[idx];
  const selected = state.optAnswers[idx];

  app.innerHTML = `
    ${topbar(2)}
    <div class="card">
      <div class="qmeta">Perbandingan Opsi ${idx+1} dari ${CRITERIA.length}</div>
      <div class="qtitle">Untuk kriteria <b>#${crit.id} — ${crit.name}</b>, opsi mana yang lebih unggul?</div>
      <p class="lede" style="margin-bottom:18px;">${crit.desc}</p>

      <div class="versus">
        <div class="side left">
          <div class="num" style="color:var(--teal-dark)">OPSI A</div>
          <div class="label">${OPTION_A.label.replace("Opsi A — ","")}</div>
          <div class="desc">${OPTION_A.short}</div>
        </div>
        <div class="vs">VS</div>
        <div class="side right">
          <div class="num" style="color:#8A6318">OPSI B</div>
          <div class="label">${OPTION_B.label.replace("Opsi B — ","")}</div>
          <div class="desc">${OPTION_B.short}</div>
        </div>
      </div>

      <div class="scale">
        <div class="scale-track" id="scaleTrack">
          ${SCALE.map((v,i)=>`<button type="button" class="scale-btn ${i===4?'center':''} ${selected===i?'selected':''}" data-i="${i}">${v}</button>`).join("")}
        </div>
        <div class="scale-hints"><span>&larr; Opsi A unggul</span><span>Opsi B unggul &rarr;</span></div>
        <div class="scale-caption" id="scaleCaption">${selected!==null ? captionFor(selected) : "Pilih salah satu angka di atas"}</div>
      </div>

      <div class="btn-row">
        <button class="ghost" id="btnBack">Kembali</button>
        <button class="primary" id="btnNext" ${selected===null?"disabled":""}>${idx<CRITERIA.length-1?"Lanjut":"Lihat Hasil"}</button>
      </div>
    </div>
  `;

  function captionFor(si){
    const val = SCALE[si];
    const meaning = scaleMeaning(val);
    if(si===4) return "Kedua opsi setara untuk kriteria ini";
    const winner = si<4 ? "Opsi A" : "Opsi B";
    return `${meaning} — ${winner} lebih unggul`;
  }

  document.querySelectorAll(".scale-btn").forEach(btn=>{
    btn.onclick = ()=>{
      const i = parseInt(btn.dataset.i,10);
      state.optAnswers[idx] = i;
      renderOptions();
    };
  });

  document.getElementById("btnNext").onclick = ()=>{
    if(idx < CRITERIA.length-1){
      state.optIdx++;
      renderOptions();
    }else{
      state.step = "done";
      render();
    }
  };
  document.getElementById("btnBack").onclick = ()=>{
    if(idx>0){ state.optIdx--; renderOptions(); }
    else{ state.critIdx = CRIT_PAIRS.length-1; state.step="criteria"; render(); }
  };
}


// Menghasilkan teks deskriptif untuk satu perbandingan berpasangan,
// misal: "Kualitas Pengalaman Berlatih 3 poin lebih penting" atau "Sama penting"
function pairwiseLabel(leftName, rightName, si){
  const val = SCALE[si];
  if(si === 4) return "Sama penting";
  const winner = si < 4 ? leftName : rightName;
  return `${winner} ${val} poin lebih penting`;
}

function buildSubmissionPayload(rows, scoreA, scoreB, CR){
  const payload = {
    "Timestamp": new Date().toISOString(),
    "Nama": state.profile.name,
    "Peran": state.profile.role,
  };

  // Kolom per pasangan kriteria, contoh header:
  // "Kualitas Pengalaman Berlatih vs Keandalan Peralatan & Kontinuitas Layanan"
  CRIT_PAIRS.forEach(([a,b], i)=>{
    const leftName = CRITERIA[a].name;
    const rightName = CRITERIA[b].name;
    const header = `${leftName} vs ${rightName}`;
    payload[header] = pairwiseLabel(leftName, rightName, state.critAnswers[i]);
  });

  // Kolom per kriteria untuk perbandingan Opsi A vs Opsi B, contoh header:
  // "Opsi A vs Opsi B - Kualitas Pengalaman Berlatih"
  CRITERIA.forEach((c,i)=>{
    const header = `Opsi A vs Opsi B - ${c.name}`;
    payload[header] = pairwiseLabel("Opsi A", "Opsi B", state.optAnswers[i]);
  });

  // Kolom hasil akhir
  rows.forEach(r=>{
    payload[`Bobot - ${r.criteria.name}`] = (r.weight*100).toFixed(1) + "%";
  });
  payload["Skor Opsi A"] = (scoreA*100).toFixed(1) + "%";
  payload["Skor Opsi B"] = (scoreB*100).toFixed(1) + "%";
  payload["Consistency Ratio"] = CR.toFixed(3);

  return payload;
}

async function submitToGoogleSheets(payload){
  if(!GOOGLE_SCRIPT_URL){
    throw new Error("GOOGLE_SCRIPT_URL belum diisi. Ikuti panduan setup Google Sheets.");
  }

  const response = await fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    headers: {"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  });

  const text = await response.text();
  let result;
  try { result = JSON.parse(text); } catch(e) { result = {raw:text}; }

  if(!response.ok || result.status === "error"){
    throw new Error(result.message || "Gagal mengirim data.");
  }
  return result;
}

/* ---- STEP 3: DONE / RESULTS ---- */
function renderDone(){
  const { rows, scoreA, scoreB, CR } = computeResults();
  const winner = scoreA>scoreB ? "A" : "B";
  const crOk = CR<=0.10;

  app.innerHTML = `
    ${topbar(3)}
    <div class="card">
      <div class="thanks-hero">
        <div class="eyebrow">SELESAI</div>
        <div class="big">Terima kasih, ${state.profile.name || "responden"}!</div>
        <p class="lede" style="margin-top:8px;">Penilaian Anda sudah lengkap. Berikut ringkasan hasil AHP berdasarkan seluruh jawaban perbandingan berpasangan yang telah Anda berikan.</p>
      </div>

      <div class="final-score">
        <div class="score-card ${winner==='A'?'win':''}">
          <div class="who">OPSI A — GYM EKONOMIS</div>
          <div class="val">${(scoreA*100).toFixed(1)}%</div>
          ${winner==='A'?'<span class="pill">Skor tertinggi</span>':''}
        </div>
        <div class="score-card ${winner==='B'?'win':''}">
          <div class="who">OPSI B — GYM PREMIUM</div>
          <div class="val">${(scoreB*100).toFixed(1)}%</div>
          ${winner==='B'?'<span class="pill">Skor tertinggi</span>':''}
        </div>
      </div>

      <table class="results">
        <thead>
          <tr><th>Kriteria</th><th class="num">Bobot</th><th class="num">Opsi A</th><th class="num">Opsi B</th></tr>
        </thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td>#${r.criteria.id} ${r.criteria.name}</td>
              <td class="num">${(r.weight*100).toFixed(1)}%</td>
              <td class="num">${(r.wA*100).toFixed(0)}%</td>
              <td class="num">${(r.wB*100).toFixed(0)}%</td>
            </tr>`).join("")}
        </tbody>
      </table>

      <div class="cr-box ${crOk?'cr-ok':'cr-bad'}">
        <b>Consistency Ratio (CR) kriteria: ${CR.toFixed(3)}</b><br>
        ${crOk
          ? "CR ≤ 0,10 — penilaian Anda pada perbandingan antarkriteria cukup konsisten."
          : "CR > 0,10 — penilaian pada perbandingan antarkriteria kurang konsisten. Pertimbangkan mengulang beberapa perbandingan agar hasil lebih dapat dipertanggungjawabkan."}
      </div>

      <p class="footnote" id="submitStatus">Klik tombol di bawah untuk mengirim jawaban Anda. Data akan direkap otomatis oleh penyelenggara.</p>

      <div class="btn-row">
        <button class="primary" id="btnSubmit">Kirim Jawaban</button>
      </div>
      <div class="btn-row">
        <button class="ghost" id="btnDownloadJson">Unduh Data Lengkap (JSON)</button>
        <button class="ghost" id="btnDownloadCsv">Unduh Ringkasan (CSV)</button>
      </div>
      <div class="btn-row">
        <button class="link" id="btnRestart">Isi ulang dari awal</button>
      </div>
    </div>
  `;

  document.getElementById("btnSubmit").onclick = async ()=>{
    const btn = document.getElementById("btnSubmit");
    const status = document.getElementById("submitStatus");

    btn.disabled = true;
    btn.textContent = "Mengirim...";
    status.textContent = "Sedang mengirim jawaban Anda...";

    try{
      const payload = buildSubmissionPayload(rows, scoreA, scoreB, CR);
      await submitToGoogleSheets(payload);
      status.innerHTML = "<b>Jawaban berhasil dikirim.</b> Terima kasih atas partisipasi Anda!";
      btn.textContent = "✓ Sudah Terkirim";
      btn.disabled = true;
    }catch(err){
      console.error(err);
      status.textContent = "Jawaban belum terkirim. " + err.message;
      btn.disabled = false;
      btn.textContent = "Coba Kirim Lagi";
    }
  };

  document.getElementById("btnDownloadJson").onclick = ()=> downloadJson(rows, scoreA, scoreB, CR);
  document.getElementById("btnDownloadCsv").onclick = ()=> downloadCsv(rows, scoreA, scoreB, CR);
  document.getElementById("btnRestart").onclick = ()=>{
    state.step="intro";
    state.critAnswers = new Array(CRIT_PAIRS.length).fill(null);
    state.critIdx = 0;
    state.optAnswers = new Array(CRITERIA.length).fill(null);
    state.optIdx = 0;
    render();
  };
}

/* ---------------------------------------------------------
   EXPORT
--------------------------------------------------------- */
function triggerDownload(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadJson(rows, scoreA, scoreB, CR){
  const m = buildCriteriaMatrix();
  const payload = {
    responden: state.profile,
    tanggal: new Date().toISOString(),
    kriteria: CRITERIA,
    matriks_kriteria: m,
    jawaban_kriteria: CRIT_PAIRS.map(([a,b],i)=>({
      kriteria_kiri: CRITERIA[a].name, kriteria_kanan: CRITERIA[b].name,
      nilai_terpilih: SCALE[state.critAnswers[i]], index: state.critAnswers[i]
    })),
    jawaban_opsi: CRITERIA.map((c,i)=>({
      kriteria: c.name, nilai_terpilih: SCALE[state.optAnswers[i]], index: state.optAnswers[i]
    })),
    hasil: {
      bobot_kriteria: rows.map(r=>({kriteria:r.criteria.name, bobot:r.weight})),
      skor_opsi_a: scoreA, skor_opsi_b: scoreB,
      consistency_ratio: CR
    }
  };
  triggerDownload(`ahp_gym_${(state.profile.name||"responden").replace(/\s+/g,"_")}.json`, JSON.stringify(payload,null,2), "application/json");
}

function downloadCsv(rows, scoreA, scoreB, CR){
  let lines = ["Kriteria,Bobot,Opsi A,Opsi B"];
  rows.forEach(r=>{
    lines.push(`"#${r.criteria.id} ${r.criteria.name}",${(r.weight*100).toFixed(2)}%,${(r.wA*100).toFixed(1)}%,${(r.wB*100).toFixed(1)}%`);
  });
  lines.push("");
  lines.push(`Skor Akhir Opsi A,${(scoreA*100).toFixed(2)}%`);
  lines.push(`Skor Akhir Opsi B,${(scoreB*100).toFixed(2)}%`);
  lines.push(`Consistency Ratio,${CR.toFixed(4)}`);
  triggerDownload(`ahp_gym_ringkasan_${(state.profile.name||"responden").replace(/\s+/g,"_")}.csv`, lines.join("\n"), "text/csv");
}

render();
</script>
